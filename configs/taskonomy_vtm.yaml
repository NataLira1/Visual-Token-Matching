seed: 0

data:
  # Caminho local. O notebook Colab sobrescreve este valor para o Google Drive.
  root: data/taskonomy
  manifest: outputs/taskonomy_manifest.json
  image_size: 128
  min_positive_fraction: 0.01
  max_train_pairs: 2000
  max_val_pairs: 300
  max_test_queries_per_class: 100
  uncertain_id: 0
  train_classes:
    dining_table: 7
    tv: 9
    microwave: 10
    oven: 11
    sink: 13
    refrigerator: 14
    clock: 16
    vase: 17
  val_classes:
    plant: 5
    bed: 6
  test_classes:
    chair: 3
    couch: 4

model:
  backbone: vit_tiny_patch16_224
  pretrained: true
  feature_blocks: [2, 5, 8, 11]
  label_depth: 4
  num_heads: 4
  decoder_width: 96
  dropout: 0.0

train:
  episodes: 5000
  support_size: 4
  query_size: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  validation_interval: 100
  validation_episodes: 20
  early_stopping_patience: 500
  mixed_precision: true
  checkpoint: outputs/vtm_best.pt

adapt:
  learning_rate: 0.005
  steps:
    1: 100
    5: 200
    10: 300
  baseline_learning_rate: 0.005
  baseline_steps:
    1: 100
    5: 200
    10: 300

experiment:
  shots: [1, 5, 10]
  seeds: [0, 1, 2]
  output_dir: outputs/evaluation
  # O código oficial do VTM usa 0.2 para segmentação semântica.
  threshold: 0.2
  min_test_supports: 10
  min_test_queries: 30
