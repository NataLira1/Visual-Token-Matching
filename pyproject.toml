[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtm-taskonomy"
version = "0.1.0"
description = "Protótipo didático de Visual Token Matching no Taskonomy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "timm==1.0.26",
]

[project.optional-dependencies]
experiment = [
  "fastcore<1.6",
  "matplotlib>=3.8",
  "omnidata-tools",
  "pandas>=2",
  "tqdm>=4.66",
]
test = ["pytest>=8"]

[project.scripts]
vtm-taskonomy = "vtm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
